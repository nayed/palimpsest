[package]
name = "palimpsest-cli"
description = "Builds Palimpsest data files from local git clones."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "palimpsest"
path = "src/main.rs"

[dependencies]
palimpsest-core = { path = "../core" }
clap = { version = "4.6.8", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.154"
