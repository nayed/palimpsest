# Deploy from this folder: npx wrangler@4.165.0 deploy --var ALLOWED_ORIGINS:<site origin>
name = "palimpsest-git-proxy"
main = "src/proxy.ts"
compatibility_date = "2026-11-01"

[vars]
# Set to the site's origin when deploying, e.g. "https://palimpsest.pages.dev".
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
