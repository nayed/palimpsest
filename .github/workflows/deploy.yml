# Tests every push and pull request; on main, then deploys to Cloudflare:
# the git proxy (proxy/) and the site (web/), as `pnpm ship` does locally.
#
# Needs a repository secret CLOUDFLARE_API_TOKEN (a token allowed to edit
# Workers on the account) and a variable CLOUDFLARE_ACCOUNT_ID.

name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Unit tests
        run: pnpm test
        working-directory: web
      - name: Browser tests (Google Chrome)
        run: pnpm test:e2e
        working-directory: web
        env:
          CI: true

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://palimpsest.nayed.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing is deployed."

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Deploy the git proxy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: ../web/node_modules/.bin/wrangler deploy
        working-directory: proxy
      - name: Build and deploy the site
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm ship
        working-directory: web
